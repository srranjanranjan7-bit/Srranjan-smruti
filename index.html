<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Sensitivity - Smruti Gaming</title>
    <style>
        body {
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://wallpaperaccess.com/full/1535199.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid #ff4500;
            margin-top: 20px;
            box-shadow: 0px 0px 25px #ff4500;
            max-width: 400px;
            width: 90%;
        }

        /* Logo Styling */
        .logo-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #ff4500;
            box-shadow: 0px 0px 15px #ff4500;
            margin-bottom: 15px;
        }

        h1 { 
            color: #ff4500; 
            text-shadow: 2px 2px 5px #000;
            font-size: 2rem;
            margin: 10px 0;
        }

        p { font-size: 1rem; color: #ccc; }

        select {
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
            background: #222;
            color: white;
            border: 1px solid #555;
            margin: 20px 0;
        }

        button {
            background: #ff4500;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background: #fff;
            color: #ff4500;
            box-shadow: 0px 0px 15px #fff;
        }

        .result {
            margin-top: 25px;
            font-size: 1.1rem;
            background: rgba(255, 69, 0, 0.1);
            padding: 15px;
            border-radius: 12px;
            display: none;
            border-left: 5px solid #ff4500;
            text-align: left;
        }

        .yt-section { margin-top: 30px; }

        .yt-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            background: #ff0000;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            animation: glow 1.5s infinite;
        }

        @keyframes glow {
            0% { box-shadow: 0 0 5px #ff0000; }
            50% { box-shadow: 0 0 20px #ff0000; }
            100% { box-shadow: 0 0 5px #ff0000; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://yt3.ggpht.com/ytc/AIdro_ntL7VbU_YmQvN4hQW5jQvR2rM1A2B3C4D5E6F7=s176-c-k-c0x00ffffff-no-rj" alt="Smruti Gaming Logo" class="logo-img">
        
        <h1>Smruti Gaming 🔥</h1>
        <p>Get Best Free Fire Sensitivity</p>
        
        <select id="device">
            <option value="">-- Select Your Phone --</option>
            <option value="low">2GB - 4GB RAM Mobile</option>
            <option value="mid">6GB - 8GB RAM Mobile</option>
            <option value="high">iPhone / High End</option>
        </select>
        
        <button onclick="showSensitivity()">Show Settings</button>

        <div id="result" class="result">
            <h3 style="color: #ff4500; margin-top: 0;">✅ Settings for You:</h3>
            <div id="sens-data"></div>
        </div>

        <div class="yt-section">
            <a href="https://www.youtube.com/@SmrutiGaming-n3e" class="yt-link" target="_blank">
                SUBSCRIBE MY CHANNEL
            </a>
        </div>
    </div>

    <script>
        function showSensitivity() {
            var device = document.getElementById("device").value;
            var data = document.getElementById("sens-data");
            var resultDiv = document.getElementById("result");
            
            if(device === "") {
                alert("Please select your phone first!");
                return;
            }

            resultDiv.style.display = "block";
            
            if(device === "low") {
                data.innerHTML = "<b>General:</b> 100 <br> <b>Red Dot:</b> 95 <br> <b>2x Scope:</b> 90 <br> <b>DPI:</b> 410";
            } else if(device === "mid") {
                data.innerHTML = "<b>General:</b> 95 <br> <b>Red Dot:</b> 88 <br> <b>2x Scope:</b> 85 <br> <b>DPI:</b> 480";
            } else {
                data.innerHTML = "<b>General:</b> 90 <br> <b>Red Dot:</b> 80 <br> <b>2x Scope:</b> 75 <br> <b>DPI:</b> Default";
            }
        }
    </script>

</body>
</html>
