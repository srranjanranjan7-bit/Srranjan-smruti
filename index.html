        body {

            background-size: cover;
            background-attachment: fixed;
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            background: rgba(10, 10, 10, 0.95);
            padding: 30px;
            border-radius: 25px;
            border: 2px solid #ff4500;
            max-width: 800px;
            margin: auto;
            box-shadow: 0px 0px 30px rgba(255, 69, 0, 0.3);
        }

        h1 { color: #ff4500; font-size: 2.5rem; text-transform: uppercase; margin-bottom: 20px; }

        /* Pro Players Section */
        .pro-section {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .player-card {
            background: #222;
            padding: 10px;
            border-radius: 15px;
            width: 110px;
            border: 1px solid #444;
            transition: 0.3s;
            cursor: pointer;
        }

        .player-card:hover { border-color: #ff4500; transform: scale(1.05); }

        .player-card img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ff4500;
            margin-bottom: 8px;
        }

        .player-card p { font-size: 12px; margin: 0; font-weight: bold; }

        /* Form Section */
        .input-box {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        select, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 18px;
            border: none;
        }

        select { background: #333; color: white; border: 1px solid #555; }

        button {
            background: #ff4500;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover { background: #fff; color: #ff4500; }

        .result {
            margin-top: 20px;
            background: rgba(255, 69, 0, 0.1);
            padding: 20px;
            border-radius: 15px;
            display: none;
            border: 1px solid #ff4500;
            text-align: left;
        }

        .yt-btn {
            display: inline-block;
            margin-top: 30px;
            background: #ff0000;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
